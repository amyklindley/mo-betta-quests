name: Refresh wiki data

# Scrapes the community wiki every night and commits quests.json / items.json / npcs.json / zones.json
# when anything changed. The overlay and the Discord bot pull these files from this repo daily,
# so a wiki edit reaches everyone within about a day with nobody doing anything.

on:
  workflow_dispatch:   # manual only: the wiki returns 403 to GitHub-hosted runners, so the nightly run happens from a home PC (nightly-refresh.bat)

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape quests
        run: python wiki_quests.py
      - name: Scrape items, NPCs and zones
        run: python wiki_data.py
      - name: Commit if changed
        run: |
          git config user.name "wiki-refresh bot"
          git config user.email "actions@users.noreply.github.com"
          git add quests.json items.json npcs.json zones.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Wiki data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
